name: Android APK

# 推送即编译：main/master 分支推送或手动触发 → 产出可安装 APK 工件；
# 推送 v* 标签时额外把 APK 附到 GitHub Release。
#
# 签名策略（零配置可用）：
#   - 未配置 secrets：首次构建自动生成密钥并由 actions/cache 跨构建复用，
#     签名稳定 → APK 可持续覆盖安装。
#   - 配置 secrets 后立即切换自有密钥（注意：换签名需先卸载旧版再安装）：
#       KEYSTORE_BASE64      keystore 文件的 base64（keytool 生成后 base64 编码）
#       KEYSTORE_PASSWORD    keystore 口令（可选，默认 tokenmonitor）
#       KEY_ALIAS            别名（可选，默认 tokenmonitor）
#       KEY_PASSWORD         key 口令（可选，默认 tokenmonitor）

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # tag 构建时向 GitHub Release 附带 APK

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # ubuntu runner 自带 Android SDK 且许可已接受；缺失组件由 Gradle 自动安装
      # （android-actions/setup-android@v3 的许可步骤在预装 SDK 上会间歇性失败，故不使用）
      - name: Restore signing keystore
        uses: actions/cache@v4
        with:
          path: android/app/release.keystore
          key: token-monitor-android-keystore-v1

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: bash scripts/prepare-keystore.sh

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor (regenerate cordova plugin project + copy web assets)
        run: npx cap sync android

      - name: Build debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          android/gradlew -p android assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: android/gradlew -p android assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Token-Monitor-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Token-Monitor-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
